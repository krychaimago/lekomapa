name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm test
      - run: npx astro check
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Start local Supabase
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' > supabase.env
      - name: SQL checks (RLS and history invariants)
        run: |
          # Probes first: the gate must be able to turn red. Each probe has to make the runner exit non-zero
          # for its own reason; any other failure (no container, crash) means the probe measured nothing.
          expect_probe_failure() {
            probe="$1"; reason="$2"
            if output=$(node scripts/db-checks.mjs "$probe" 2>&1); then
              echo "$output"
              echo "::error::SQL gate probe $probe passed, but it must fail. The gate cannot turn red."
              exit 1
            fi
            echo "$output"
            if ! grep -qF "FAIL $probe: $reason" <<<"$output"; then
              echo "::error::SQL gate probe $probe failed for the wrong reason (expected: $reason)."
              exit 1
            fi
            echo "Probe $probe failed as expected: $reason"
          }
          # Schema probes: DDL that breaks one rule, composed with a check file by the runner (`--probe`) inside the
          # check file's transaction. Each must fail the runner AND print the named check it targets; a failure for
          # another reason (bad DDL, an earlier check) means the probe did not measure its rule.
          expect_invariant_failure() {
            probe="$1"; check="$2"; expected="$3"
            if output=$(node scripts/db-checks.mjs --probe "$probe" "$check" 2>&1); then
              echo "$output"
              echo "::error::Schema probe $probe passed against $check, but it must fail with: $expected"
              exit 1
            fi
            echo "$output"
            if ! grep -qF "$expected" <<<"$output"; then
              echo "::error::Schema probe $probe failed for the wrong reason (expected: $expected)."
              exit 1
            fi
            echo "Probe $probe failed as expected: $expected"
          }
          expect_probe_failure scripts/db-checks/probes/failing-check.sql "psql exited with code 3"
          expect_probe_failure scripts/db-checks/probes/missing-marker.sql "file finished without completion marker"
          expect_invariant_failure scripts/db-checks/probes/account-table-without-rls.sql supabase/tests/schema_invariants_checks.sql "INVARIANT 3 FAILED"
          expect_invariant_failure scripts/db-checks/probes/account-fk-set-null.sql supabase/tests/schema_invariants_checks.sql "INVARIANT 2 FAILED"
          expect_invariant_failure scripts/db-checks/probes/account-table-without-cascade-path.sql supabase/tests/schema_invariants_checks.sql "INVARIANT 2 FAILED: account tables not reached"
          expect_invariant_failure scripts/db-checks/probes/unclassified-table.sql supabase/tests/schema_invariants_checks.sql "INVARIANT 1 FAILED"
          expect_invariant_failure scripts/db-checks/probes/window-execute-for-authenticated.sql supabase/tests/schema_invariants_checks.sql "INVARIANT 7 FAILED"
          expect_invariant_failure scripts/db-checks/probes/period-window-execute-for-authenticated.sql supabase/tests/schema_invariants_checks.sql "INVARIANT 7 FAILED: anon or authenticated can execute security definer functions"
          expect_invariant_failure scripts/db-checks/probes/definer-without-search-path.sql supabase/tests/schema_invariants_checks.sql "INVARIANT 7 FAILED: security definer functions without a pinned search_path"
          expect_invariant_failure scripts/db-checks/probes/account-table-truncate-for-anon.sql supabase/tests/schema_invariants_checks.sql "INVARIANT 6 FAILED"
          expect_invariant_failure scripts/db-checks/probes/view-without-security-invoker.sql supabase/tests/schema_invariants_checks.sql "INVARIANT 9 FAILED"
          expect_invariant_failure scripts/db-checks/probes/account-table-without-fixture.sql supabase/tests/account_isolation_checks.sql "ISOLATION 0 FAILED: probe_account_without_fixture has no test data"
          expect_invariant_failure scripts/db-checks/probes/interaction-pairs-empty.sql supabase/tests/fr012_language_checks.sql "LANGUAGE 1 FAILED"
          expect_invariant_failure scripts/db-checks/probes/pair-description-without-phrase.sql supabase/tests/fr012_language_checks.sql "LANGUAGE 2 FAILED"
          expect_invariant_failure scripts/db-checks/probes/dosage-period-without-variant-guard.sql supabase/tests/dosage_change_checks.sql "DOSAGE 14 FAILED: a direct insert with a variant of another name gave ok"
          npm run db:check
      - name: Configure secrets for build and preview
        run: |
          source supabase.env
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          cp .env .dev.vars
      - run: npm run build
      - name: Run smoke test against production preview
        run: |
          npm run preview -- --port 4321 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          BASE_URL=http://localhost:4321 npm run smoke
      - if: always()
        run: supabase stop --no-backup

  deploy:
    needs: [ci, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy -c dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
