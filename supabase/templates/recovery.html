<h2>Ustaw nowe hasło</h2>
<p>Ktoś poprosił o ustawienie nowego hasła do Twojego konta w lekomapie.</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery">Ustaw nowe hasło</a></p>
<p>Odnośnik jest ważny przez 1 godzinę i działa jeden raz.</p>
<p>Jeśli to nie Ty prosiłaś o zmianę hasła, zignoruj tę wiadomość — Twoje hasło pozostanie bez zmian.</p>
